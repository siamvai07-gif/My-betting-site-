    <!-- ============================================================

    <script>
    // 1. Primary Platform Firebase Connection
    const firebaseConfig = {
      apiKey: "AIzaSyBGaFtX-4JYrW_rhKLn--_hHgo1I2UdGGE",
      authDomain: "luckyspin-5ff98.firebaseapp.com",
      databaseURL: "https://luckyspin-5ff98-default-rtdb.firebaseio.com",
      projectId: "luckyspin-5ff98",
      storageBucket: "luckyspin-5ff98.firebasestorage.app",
      messagingSenderId: "653880368423",
      appId: "1:653880368423:web:5efc8fc2f06d0bd7765d02",
      measurementId: "G-BK1VH2ZFG8"
    };

    let db = null;
    let userRef = null;
    let adminControlRef = null;
    let currentLoggedUserPhone = localStorage.getItem('bd99_user') || '01700000000';
    let userRecord = null;
    let balance = 0.00;

    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        userRef = db.ref('users/' + currentLoggedUserPhone);
        adminControlRef = db.ref('admin_control/aviator_data');
    } catch (e) {
        console.warn("Firebase initial load:", e);
    }

    // Connect user and live balance
    function syncUser() {
        if (!userRef) return;
        userRef.on('value', snap => {
            if (snap.exists()) {
                userRecord = snap.val();
                balance = parseFloat(userRecord.balance || 0);
                document.getElementById('user-balance-amount').innerText = balance.toFixed(2);
                document.getElementById('userIdText').innerText = userRecord.uid || currentLoggedUserPhone;
                if (userRecord.avatar) document.getElementById('avatarImg').src = userRecord.avatar;
            }
        });
    }

    function returnToHome() {
        const bgmAudio = document.getElementById('bgm');
        if (bgmAudio) bgmAudio.pause();
        const flyAudio = document.getElementById('start-sfx');
        if (flyAudio) flyAudio.pause();
        
        // If loaded within an iframe in AVVV.html or index.html
        if (window.parent && window.parent !== window && typeof window.parent.closeAviatorGame === 'function') {
            window.parent.closeAviatorGame();
        } else {
            window.location.href = "/";
        }
    }

    // Game variables
    let soundEnabled = true; let musicEnabled = true; let animEnabled = true;
    let simulatedBets = []; let totalWinBDT = 0;
    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    const plane = document.getElementById('plane-wrap'); const multTxt = document.getElementById('multiplier');
    const flewTxt = document.getElementById('flew-away'); const loader = document.getElementById('round-loader');
    const lFill = document.getElementById('l-fill'); const crashSfx = document.getElementById('crash');
    const startSfx = document.getElementById('start-sfx'); const multiplierGlow = document.getElementById('multiplier-glow');

    let cw = 0, ch = 0; let serverOffset = 0, state = 'loading', roundStart = 0, crashAt = 1.00;
    let soundPlayed = false, crashSoundPlayed = false, currentVal = 1.00;
    let localLoadingStartMs = 0, initialLoadingProgress = 0;
    const totalLoadingTime = 5.5;
    let frontendStartTime = 0; let initialJoinOffsetSec = 0;
    let lastTx = 0, lastTy = 0;
    let extendedHistory = [1.25, 4.20, 2.15, 1.09, 3.80, 5.50, 1.30, 2.05];

    let p = { 
        1: { status: 'IDLE', bet: 10.00, locked: 0, autoBetEnabled: false, autoCashOutEnabled: false, autoCashOutValue: 2.00 }, 
        2: { status: 'IDLE', bet: 10.00, locked: 0, autoBetEnabled: false, autoCashOutEnabled: false, autoCashOutValue: 2.00 } 
    };

    // Controls
    function validate(id) {
        let el = document.getElementById('val-'+id); let v = parseFloat(el.value);
        if (isNaN(v) || v < 1) v = 10;
        el.value = v.toFixed(2); p[id].bet = v;
        if (p[id].status === 'IDLE') document.getElementById('sub-'+id).innerHTML = v.toFixed(2) + ' ৳';
    }

    function step(id, delta) {
        let el = document.getElementById('val-'+id);
        let v = (parseFloat(el.value) || 10) + delta * 5;
        if (v < 1) v = 1;
        el.value = v.toFixed(2); validate(id);
    }

    function set(id, val) {
        document.getElementById('val-'+id).value = parseFloat(val).toFixed(2); validate(id);
    }

    function switchTab(panelId, mode) {
        const panel = document.getElementById('panel-' + panelId);
        const currentTabs = panel.querySelectorAll('.tab');
        const autoControls = document.getElementById('auto-controls-' + panelId);
        currentTabs.forEach(t => t.classList.remove('active'));
        if (mode === 'bet') {
            currentTabs[0].classList.add('active');
            autoControls.classList.remove('active');
        } else {
            currentTabs[1].classList.add('active');
            autoControls.classList.add('active');
        }
    }

    function toggleAutoBet(panelId) { p[panelId].autoBetEnabled = document.getElementById('auto-bet-' + panelId).checked; }
    function toggleAutoCashOut(panelId) { p[panelId].autoCashOutEnabled = document.getElementById('auto-cashout-toggle-' + panelId).checked; }

    function handle(id) {
        validate(id);
        const betAmount = parseFloat(document.getElementById('val-' + id).value);
        let s = p[id];
        let btn = document.getElementById('btn-'+id);
        let lbl = document.getElementById('lbl-'+id);
        let sub = document.getElementById('sub-'+id);

        if (s.status === 'IDLE') {
            if (balance < betAmount) { displayNotice("Not enough balance"); return; }
            balance -= betAmount;
            document.getElementById('user-balance-amount').innerText = balance.toFixed(2);

            // Deduct in Firebase
            if (userRef) {
                userRef.child('balance').transaction(cur => {
                    let b = (typeof cur === 'number') ? cur : 0;
                    return Math.max(0, b - betAmount);
                });
                userRef.child('wager_left').transaction(cur => {
                    let w = (typeof cur === 'number') ? cur : 0;
                    return Math.max(0, w - betAmount);
                });
            }

            let isCurrentlyLoading = state === 'loading' || state === 'crashed';
            if (isCurrentlyLoading) {
                s.status = 'READY'; s.locked = betAmount;
                btn.className = "action-btn btn-cancel"; lbl.innerText = "Cancel"; sub.innerHTML = betAmount.toFixed(2) + ' ৳';
            } else {
                s.status = 'WAIT'; s.locked = betAmount;
                btn.className = "action-btn btn-cancel"; lbl.innerText = "Cancel"; sub.innerHTML = 'Waiting next round';
            }
        } else if (s.status === 'READY' || s.status === 'WAIT') {
            balance += s.locked;
            document.getElementById('user-balance-amount').innerText = balance.toFixed(2);
            if (userRef) userRef.child('balance').transaction(cur => (cur || 0) + s.locked);

            s.status = 'IDLE'; s.locked = 0;
            btn.className = "action-btn btn-bet"; lbl.innerText = "Bet"; sub.innerHTML = p[id].bet.toFixed(2) + ' ৳';
        } else if (s.status === 'ACTIVE') {
            let winAmount = s.locked * currentVal;
            balance += winAmount;
            document.getElementById('user-balance-amount').innerText = balance.toFixed(2);

            // Credit in Firebase
            if (userRef) {
                userRef.child('balance').transaction(cur => (cur || 0) + winAmount);
                // Log win transaction
                userRef.child('transactions').push({
                    type: 'Aviator Win',
                    amount: winAmount,
                    method: 'Game',
                    status: 'Complete',
                    date: new Date().toLocaleString(),
                    timestamp: Date.now()
                });
            }

            s.status = 'IDLE'; s.locked = 0;
            if (soundEnabled) {
                const cashSfx = document.getElementById('cashout-sfx');
                if (cashSfx) { cashSfx.currentTime = 0; cashSfx.play().catch(()=>{}); }
            }
            btn.className = "action-btn btn-bet"; lbl.innerText = "Bet"; sub.innerHTML = p[id].bet.toFixed(2) + ' ৳';
            showCashoutPopup(currentVal, winAmount);
        }
    }

    function checkCashouts() {
        for (let id in p) {
            if (state === 'flying' && p[id].status === 'READY') {
                p[id].status = 'ACTIVE';
                let btn = document.getElementById('btn-'+id);
                btn.className = "action-btn btn-cashout";
                document.getElementById('lbl-'+id).innerText = "Cash Out";
            }
            if (p[id].status === 'ACTIVE') {
                let win = p[id].locked * currentVal;
                document.getElementById('sub-'+id).innerHTML = win.toFixed(2) + ' ৳';
                if (p[id].autoCashOutEnabled) {
                    let autoVal = parseFloat(document.getElementById('auto-cashout-value-' + id).value);
                    if (currentVal >= autoVal) handle(id);
                }
            }
        }
    }

    function resetBets() {
        for (let id in p) {
            if (p[id].status === 'ACTIVE') {
                p[id].status = 'IDLE'; p[id].locked = 0;
                let btn = document.getElementById('btn-'+id);
                btn.className = "action-btn btn-bet";
                document.getElementById('lbl-'+id).innerText = "Bet";
                document.getElementById('sub-'+id).innerHTML = p[id].bet.toFixed(2) + ' ৳';
            } else if (p[id].status === 'WAIT') {
                p[id].status = 'READY';
                let btn = document.getElementById('btn-'+id);
                btn.className = "action-btn btn-cancel";
                document.getElementById('lbl-'+id).innerText = "Cancel";
                document.getElementById('sub-'+id).innerHTML = p[id].locked.toFixed(2) + ' ৳';
            }
        }
    }

    function displayNotice(msg) {
        const notifArea = document.getElementById('notification-area');
        const popup = document.createElement('div');
        popup.className = 'popup-anim';
        popup.innerHTML = `<div class="error-popup"><div class="text-message">${msg}</div><button class="close-btn" onclick="this.closest('.popup-anim').remove()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>`;
        notifArea.appendChild(popup);
        setTimeout(() => { if (popup.parentElement) popup.remove(); }, 3000);
    }

    function showCashoutPopup(multiplier, amount) {
        const notifArea = document.getElementById('notification-area');
        const popup = document.createElement('div');
        popup.className = 'popup-anim';
        popup.innerHTML = `<div class="cashout-popup"><div class="left-section"><div class="text-top">Cashed Out!</div><div class="text-bottom">${multiplier.toFixed(2)}x</div></div><div class="right-section"><div class="win-badge"><div class="win-text-top">Win ৳</div><div class="win-text-bottom">${amount.toFixed(2)}</div></div><button class="close-btn" onclick="this.closest('.popup-anim').remove()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div></div>`;
        notifArea.appendChild(popup);
        setTimeout(() => { if (popup.parentElement) popup.remove(); }, 3000);
    }

    // Engine loop & crash generation
    async function determineCrashPoint() {
        // 1. Check Admin Direct Signal
        try {
            if (db) {
                const s = await db.ref('admin_control/aviator_data/direct_signal').once('value');
                const v = s.val();
                if (v && !isNaN(parseFloat(v)) && parseFloat(v) > 1.0) {
                    await db.ref('admin_control/aviator_data/direct_signal').remove();
                    return parseFloat(v);
                }
                // 2. Check Queue
                const qSnap = await db.ref('admin_control/aviator_data/signal_queue').once('value');
                const qVal = qSnap.val();
                if (qVal && typeof qVal === 'string') {
                    let queue = qVal.split(',').map(x => x.trim()).filter(Boolean);
                    if (queue.length > 0) {
                        let next = parseFloat(queue.shift());
                        await db.ref('admin_control/aviator_data/signal_queue').set(queue.join(', '));
                        return next;
                    }
                }
            }
        } catch (e) {}

        const r = Math.random();
        if (r < 0.05) return 1.00;
        let cp = 0.96 / (1 - r);
        cp = Math.floor(cp * 100) / 100;
        if (!isFinite(cp) || cp < 1.00) cp = 1.00;
        if (cp > 40.00) cp = 40.00;
        return cp;
    }

    async function beginNextRound() {
        crashAt = await determineCrashPoint();
        roundStart = (Date.now() / 1000) + totalLoadingTime;
        state = 'loading';
        localLoadingStartMs = Date.now();
        initialLoadingProgress = 0;
        generateRoundData();
    }

    function initHistory() {
        const hBar = document.getElementById('history-bar');
        const grid = document.getElementById('history-popup-grid');
        hBar.innerHTML = ''; grid.innerHTML = '';
        extendedHistory.slice(0, 10).forEach(v => {
            let color = v < 2 ? 'color-blue' : (v < 10 ? 'color-purple' : 'color-pink');
            hBar.innerHTML += `<span class="multiplier ${color}">${v.toFixed(2)}x</span>`;
            grid.innerHTML += `<div class="history-grid-wrapper"><div class="history-grid-item ${color}">${v.toFixed(2)}x</div></div>`;
        });
    }

    function pushHistory(v) {
        extendedHistory.unshift(v);
        if (extendedHistory.length > 20) extendedHistory.pop();
        initHistory();
    }

    function triggerCrash(v) {
        loader.style.display = 'none';
        multTxt.innerText = v.toFixed(2) + 'x';
        multTxt.style.color = '#e10512';
        multTxt.style.display = 'block';
        flewTxt.style.display = 'block';

        if (animEnabled) {
            plane.style.transition = 'transform 0.65s ease-in, opacity 0.65s ease-in';
            plane.style.transform = `translate3d(${lastTx + 450}px, ${lastTy - 450}px, 0) rotate(-20deg)`;
            plane.style.opacity = '0';
        }
        multiplierGlow.style.display = 'none';
        pushHistory(v);
        resetBets();
        setTimeout(beginNextRound, 3500);
    }

    function gameLoop() {
        let now = Date.now() / 1000;
        if (state === 'loading' && now >= roundStart) {
            state = 'flying';
            frontendStartTime = performance.now();
            soundPlayed = false;
            crashSoundPlayed = false;
        }

        if (animEnabled) ctx.clearRect(0, 0, cw, ch);

        if (state === 'loading') {
            plane.style.transition = 'none';
            plane.style.opacity = '0';
            loader.style.display = 'flex';
            multTxt.style.display = 'none';
            flewTxt.style.display = 'none';
            multiplierGlow.style.display = 'none';

            let elapsed = (Date.now() - localLoadingStartMs) / 1000;
            let pct = Math.max(0, 100 - (elapsed / totalLoadingTime) * 100);
            lFill.style.width = pct + '%';
        } else if (state === 'flying') {
            loader.style.display = 'none';
            multTxt.style.display = 'block';
            flewTxt.style.display = 'none';
            if (animEnabled) plane.style.opacity = '1';

            let elapsedSec = (performance.now() - frontendStartTime) / 1000;
            currentVal = Math.pow(1.08, elapsedSec);
            if (currentVal > 40) currentVal = 40.00;

            multTxt.innerText = currentVal.toFixed(2) + 'x';
            multTxt.style.color = '#fff';

            if (animEnabled) {
                multiplierGlow.style.display = 'block';
                multiplierGlow.style.background = currentVal < 2 ? 'radial-gradient(circle, rgba(52,180,255,0.7) 0%, transparent 70%)' : (currentVal < 10 ? 'radial-gradient(circle, rgba(145,62,248,0.7) 0%, transparent 70%)' : 'radial-gradient(circle, rgba(192,23,178,0.7) 0%, transparent 70%)');
            }

            checkCashouts();

            if (!soundPlayed && soundEnabled) {
                soundPlayed = true;
                startSfx.volume = 0.5; startSfx.currentTime = 0; startSfx.play().catch(()=>{});
            }

            if (currentVal >= crashAt) {
                currentVal = crashAt;
                if (!crashSoundPlayed && soundEnabled) {
                    crashSoundPlayed = true;
                    crashSfx.volume = 0.7; crashSfx.currentTime = 0; crashSfx.play().catch(()=>{});
                }
                renderFlight(crashAt);
                triggerCrash(crashAt);
                state = 'crashed';
            } else {
                renderFlight(currentVal);
            }
        }
        requestAnimationFrame(gameLoop);
    }

    function renderFlight(val) {
        if (!animEnabled) return;
        let progress = Math.min(1, (val - 1.00) / 1.30);
        let maxTx = cw * 0.65;
        let centerPoint = ch * 0.48;
        let tx = maxTx * progress;
        let ty = ch - (ch - centerPoint) * progress;

        ctx.beginPath();
        ctx.moveTo(0, ch);
        ctx.quadraticCurveTo(tx * 0.4, ch, tx, ty);
        ctx.strokeStyle = '#b80000';
        ctx.lineWidth = 4.0;
        ctx.stroke();
        ctx.lineTo(tx, ch);
        ctx.lineTo(0, ch);
        ctx.closePath();

        let gradient = ctx.createLinearGradient(0, ty, 0, ch);
        gradient.addColorStop(0, 'rgba(184, 0, 0, 0.85)');
        gradient.addColorStop(1, 'rgba(184, 0, 0, 0.05)');
        ctx.fillStyle = gradient;
        ctx.fill();

        lastTx = tx; lastTy = ty;
        plane.style.transition = 'none';
        plane.style.transform = `translate3d(${tx}px, ${ty}px, 0) translate(-50%, -100%) rotate(-5deg)`;
    }

    function resize() {
        const area = document.querySelector('.game-screen');
        if (!area) return;
        cw = area.clientWidth; ch = area.clientHeight;
        const dpi = window.devicePixelRatio || 1;
        canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
        canvas.width = cw * dpi; canvas.height = ch * dpi;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpi, dpi);
    }

    function generateRoundData() {
        const list = document.getElementById('allBetsList');
        if (!list) return;
        let html = '';
        for (let i = 0; i < 35; i++) {
            let bet = (Math.random() * 400 + 10).toFixed(2);
            let mult = (Math.random() * 3 + 1.1).toFixed(2);
            let win = (bet * mult).toFixed(2);
            html += `
                <div class="bet-row won">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <img src="https://i.pravatar.cc/100?img=${i+10}" class="user-icon">
                        <span style="color:#9ea0a3">u***${i%10}</span>
                    </div>
                    <div>${bet}</div>
                    <div style="text-align:center; color:#34b4ff">${mult}x</div>
                    <div class="win-amount">${win}</div>
                </div>`;
        }
        list.innerHTML = html;
        document.getElementById('igc-count').innerText = Math.floor(Math.random() * 250 + 150);
    }

    function openMenu() { document.getElementById('menuOverlay').style.display = 'block'; }
    function closeMenu() { document.getElementById('menuOverlay').style.display = 'none'; }
    function openHistoryPopup() { document.getElementById('historyPopup').style.display = 'flex'; }
    function closeHistoryPopup() { document.getElementById('historyPopup').style.display = 'none'; }
    function copyUserID() {
        navigator.clipboard.writeText(document.getElementById('userIdText').innerText);
        displayNotice("UID copied to clipboard");
    }
    function showTelegramPopup() {
        window.open('https://t.me/Akram_99360', '_blank');
    }

    // Tab buttons
    document.querySelectorAll('#listTabs .list-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('#listTabs .list-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const target = tab.getAttribute('data-target');
            document.querySelectorAll('.list-tab-content').forEach(c => {
                c.classList.toggle('active-content', c.id === target);
            });
        });
    });

    window.addEventListener('load', () => {
        syncUser();
        resize();
        initHistory();
        beginNextRound();
        requestAnimationFrame(gameLoop);

        setTimeout(() => {
            document.getElementById('spribe-preloader').style.display = 'none';
            const realApp = document.getElementById('real-app');
            realApp.style.visibility = 'visible';
            realApp.style.opacity = '1';
            realApp.style.position = 'relative';
            resize();
        }, 1800);
    });

    window.addEventListener('resize', resize);
    document.body.addEventListener('click', () => {
        const bgm = document.getElementById('bgm');
        if (bgm && musicEnabled) { bgm.volume = 0.3; bgm.play().catch(()=>{}); }
        document.getElementById('audio-trigger').style.display = 'none';
    }, { once: true });
    </script>
  </body>
