<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sector Not Found | NEXUS WIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07080C; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Ambient glow -->
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-96 h-96 bg-violet-600/15 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute -bottom-40 left-1/2 -translate-x-1/2 w-96 h-96 bg-fuchsia-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-[#0D101A]/90 border border-white/10 rounded-3xl p-8 text-center relative z-10 shadow-2xl backdrop-blur-xl">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center text-3xl text-white shadow-xl shadow-violet-600/30 mb-6">
            <i class="fas fa-compass-slash"></i>
        </div>
        <div class="text-xs font-mono font-bold tracking-widest text-violet-400 uppercase mb-2">Error 404</div>
        <h1 class="text-2xl font-black text-white tracking-tight mb-3">Sector Not Found</h1>
        <p class="text-sm text-slate-400 mb-8 leading-relaxed">
            The page you are trying to reach does not exist or has been relocated within the gaming network.
        </p>
        <a href="/" class="inline-flex items-center justify-center gap-2.5 w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-violet-600/30 transition transform active:scale-[0.98]">
            <i class="fas fa-house"></i>
            <span>Return to NEXUS WIN</span>
        </a>
    </div>
</body>
</html>
